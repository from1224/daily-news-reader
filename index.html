<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>每日新闻阅读</title>
  <style>
    :root{--ink:#15334b;--muted:#61788a;--line:#d7e5ef;--blue:#1678ba;--pale:#eff8fd;--bg:#f6fafc;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:960px;margin:auto;padding:28px 20px 54px}header{padding:25px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#e2f5ff,#fff)}h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}h2{font-size:1.18rem;margin:0}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:20px 0}.control{display:grid;gap:4px;color:var(--muted);font-size:.87rem;font-weight:650}.control select,button{min-height:40px;border:1px solid #b9cedc;border-radius:9px;background:#fff;color:var(--ink);font:inherit;padding:8px 10px}button{color:#fff;background:var(--blue);border-color:var(--blue);font-weight:700;cursor:pointer}.status{margin:16px 0;padding:13px 15px;border-radius:10px;background:var(--pale);color:var(--muted)}.status[hidden]{display:none}.grid{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 4px 16px #17324d08}.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--pale);color:#21628e;font-size:.84rem;font-weight:700}.card h2{margin:8px 0 6px}.card p{margin:7px 0}.card a{color:#06669d;font-weight:700;overflow-wrap:anywhere}.meta{font-size:.88rem;color:var(--muted)}.empty{padding:28px 18px;text-align:center}.updated{margin-top:28px;font-size:.87rem;color:var(--muted)}@media(max-width:680px){.wrap{padding:18px 14px 40px}header{padding:19px}.toolbar{align-items:stretch}.control{width:100%}.control select,button{width:100%}.card{padding:15px}}
  </style>
</head>
<body>
<main class="wrap">
  <header><h1>每日新闻阅读</h1><p class="muted">固定阅读页从同源公开 JSON 读取已审核短摘要。没有登录、令牌、追踪或自动推送。</p></header>
  <section class="toolbar" aria-label="筛选新闻">
    <label class="control">日期<select id="date" disabled><option>加载中…</option></select></label>
    <label class="control">栏目<select id="section" disabled><option value="all">全部</option></select></label>
    <button id="refresh" type="button">手动刷新</button>
  </section>
  <p id="status" class="status" role="status">正在读取公开新闻索引…</p>
  <section id="items" class="grid" aria-live="polite"></section>
  <p id="updated" class="updated"></p>
</main>
<script>
(() => {
  const indexUrl = './data/index.json';
  const $ = id => document.getElementById(id);
  const date = $('date'), section = $('section'), status = $('status'), items = $('items'), updated = $('updated');
  let current = [];
  const safeText = value => String(value ?? '');
  const stamp = value => value ? new Date(value).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai', hour12:false}) : '未提供';
  function message(text, kind='') { status.hidden = false; status.textContent = text; status.dataset.kind = kind; }
  function clearMessage() { status.hidden = true; }
  function render() {
    const selected = section.value || 'all';
    const visible = selected === 'all' ? current : current.filter(item => item.section === selected);
    items.replaceChildren();
    if (!visible.length) { const el=document.createElement('div'); el.className='card empty'; el.textContent='该日期或栏目暂无已公开的新闻短摘要。'; items.append(el); return; }
    for (const item of visible) {
      const card=document.createElement('article'); card.className='card';
      const tag=document.createElement('span'); tag.className='tag'; tag.textContent=safeText(item.section);
      const title=document.createElement('h2'); title.textContent=safeText(item.title);
      const summary=document.createElement('p'); summary.textContent=safeText(item.summary);
      const meta=document.createElement('p'); meta.className='meta'; meta.textContent=`事件时间：${safeText(item.eventTime)}　更新：${stamp(item.updatedAt)}`;
      const source=document.createElement('a'); source.href=safeText(item.source?.url); source.target='_blank'; source.rel='noopener noreferrer'; source.textContent=`查看原文来源：${safeText(item.source?.name)}`;
      card.append(tag,title,summary,meta,source); items.append(card);
    }
  }
  function setSections() { const selected=section.value; const values=[...new Set(current.map(item=>item.section).filter(Boolean))]; section.replaceChildren(new Option('全部','all')); values.forEach(value=>section.add(new Option(value,value))); section.value=values.includes(selected)?selected:'all'; section.disabled=false; }
  async function loadDate() {
    if (!date.value) { current=[]; setSections(); render(); updated.textContent=''; clearMessage(); return; }
    message('正在读取该日期的公开短摘要…');
    try { const response=await fetch(`./data/${encodeURIComponent(date.value)}.json`,{cache:'no-store'}); if(!response.ok) throw new Error(`HTTP ${response.status}`); const payload=await response.json(); if(payload.schemaVersion!==1 || payload.date!==date.value || !Array.isArray(payload.items)) throw new Error('数据格式不符合公开 schema'); current=payload.items; setSections(); render(); updated.textContent=`数据更新时间：${stamp(payload.updatedAt)}（Asia/Shanghai）`; clearMessage(); }
    catch (error) { current=[]; setSections(); render(); message(`读取失败：${error.message}。请稍后手动刷新。`,'error'); }
  }
  async function loadIndex() {
    date.disabled=true; section.disabled=true; message('正在读取公开新闻索引…');
    try { const response=await fetch(indexUrl,{cache:'no-store'}); if(!response.ok) throw new Error(`HTTP ${response.status}`); const payload=await response.json(); if(payload.schemaVersion!==1 || !Array.isArray(payload.dates)) throw new Error('索引格式不符合公开 schema'); const selected=date.value; date.replaceChildren(); if(!payload.dates.length) { date.add(new Option('暂无公开简报','')); current=[]; setSections(); render(); updated.textContent=`索引更新时间：${stamp(payload.updatedAt)}（Asia/Shanghai）`; message('目前没有已公开的新闻短摘要。发布审核后的日期 JSON 后，此页会在手动刷新时读取。'); return; } payload.dates.forEach(entry=>date.add(new Option(entry.label || entry.date,entry.date))); date.value=payload.dates.some(entry=>entry.date===selected)?selected:payload.dates[0].date; date.disabled=false; await loadDate(); }
    catch (error) { current=[]; setSections(); render(); updated.textContent=''; message(`索引读取失败：${error.message}。请稍后手动刷新。`,'error'); }
  }
  date.addEventListener('change',loadDate); section.addEventListener('change',render); $('refresh').addEventListener('click',loadIndex); loadIndex();
})();
</script>
</body></html>
